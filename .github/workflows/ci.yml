name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Type-check, audit & build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        # Root tsconfig.json is solution-style (files: [] + references), so `tsc --noEmit`
        # compiles zero files and always passes. `tsc -b` follows the project references and
        # actually type-checks src (tsconfig.app.json) and vite.config (tsconfig.node.json).
        run: npx tsc -b

      - name: Security audit
        # Kör npm audit --audit-level=high --json och filtrerar bort dokumenterade
        # undantag (audit-exceptions.json). Failar på alla andra high/critical-fynd.
        # Skriptet skriver ut aktiva undantag vid varje körning. Ingen `|| true`,
        # ingen sänkt tröskel — exit-koden från skriptet är gaten.
        run: node scripts/audit-check.mjs

      - name: Build
        run: npm run build
